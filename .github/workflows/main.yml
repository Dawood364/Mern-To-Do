name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend/Test Dependencies
        run: |
          cd TODOAPP
          npm install

      - name: Run Tests
        run: |
          cd TODOAPP
          npm test
